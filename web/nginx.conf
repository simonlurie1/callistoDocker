server {
  listen 80;

  root /usr/share/nginx/html;
  index index.html;

  # Re-resolve "api" through Docker's embedded DNS instead of caching the IP
  # from startup; otherwise recreating the api container (new IP) leaves
  # nginx returning 502 until nginx itself is restarted. Using a variable in
  # proxy_pass is what forces nginx to go through the resolver.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:3000;

  # Same-origin reverse proxy to the api container, so the browser never
  # needs to know the api's host/port and there's no CORS to configure.
  location ~ ^/(leads|conversion-events|health)(/|$) {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # The api logs every line of this request under this id (and echoes it
    # back as X-Request-Id), so a request can be traced from the edge in.
    proxy_set_header X-Request-Id $request_id;
  }

  location / {
    try_files $uri /index.html;
  }
}
