services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Runs once, only when mysql-data is empty (first start / after `down -v`).
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # 127.0.0.1 (TCP), not localhost (socket): while init.sql runs, MySQL uses
      # a temporary server with networking off, so a socket ping would report
      # healthy before the tables exist and the api could start too early.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: 3000
      TRACKER_BASE_URL: ${TRACKER_BASE_URL}
      TRACKER_API_KEY: ${TRACKER_API_KEY}
    ports:
      - "${API_PORT:-3000}:3000"

  # Periodic batch service: scans conversion_events for events that need
  # posting, claims each one (in_process + processing_started_at) and posts
  # it to the tracker. Same image as the api, different entry point. Safe to
  # scale (`docker compose up -d --scale worker=2`): claims are atomic.
  worker:
    build: ./api
    command: ["node", "dist/jobs/conversionWorker.js"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TRACKER_BASE_URL: ${TRACKER_BASE_URL}
      TRACKER_API_KEY: ${TRACKER_API_KEY}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-2000}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-10}
      WORKER_STALE_AFTER_MS: ${WORKER_STALE_AFTER_MS:-300000}

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

  # Optional, dev-only stand-in for the real tracker, for exercising the
  # 5xx -> retry path without spending the real rate limit. Not started by a
  # plain `docker compose up`; see README "Testing retries with the mock".
  mock-tracker:
    build: ./api
    profiles: ["mock"]
    entrypoint: ["npx", "tsx", "src/dev/mockTracker.ts"]
    environment:
      MOCK_TRACKER_PORT: 4000
      MOCK_TRACKER_API_KEY: dev-mock-key
      MOCK_TRACKER_FORCE_500: ${MOCK_TRACKER_FORCE_500:-false}
    ports:
      - "4000:4000"

volumes:
  mysql-data:
